              - { name: size, label: "Розмір заголовка", type: select, options: { values: ["h2", "h3"] } }
          - name: spacer
            label: "Порожній відступ"
            fields: []

  # ===================== НОВІ СТОРІНКИ (З СЕКЦІЙ) =====================
  # Окремі сторінки сайту (напр. «Про нас», «Кар'єра»), які збираються з тих самих секцій, що й сторінки послуг.
  # Одна сторінка = один файл. Адреса: /<назва-файлу>. Назва файлу створюється з поля «Назва сторінки в панелі»:
  # «About Us» → about-us.json → www.altheracode.com/about-us. Пізніша зміна назви адресу не змінює.
  # Адреси, які вже зайняті (contact, blog, portfolio, services, privacy-policy), не публікуються.
  # Щоб сторінка зʼявилася в меню, додайте посилання в «Загальне» → «Меню в шапці» або «Футер — меню «Компанія»».
  - name: custom_pages
    label: Нові сторінки (з секцій)
    type: collection
    path: src/content/custom-pages
    format: json
    filename: "{primary}.json"
    view:
      primary: name
    fields:
      - { name: name, label: "Назва сторінки в панелі (з неї створюється адреса: About Us → /about-us)", type: string, required: true }
      - { name: title, label: "SEO — заголовок сторінки (вкладка браузера, Google)", type: string, required: true }
      - { name: description, label: "SEO — опис для Google", type: text, required: true }
      - { name: image, label: "Картинка для соцмереж при пересиланні посилання (необов'язково)", type: image }
      - { name: draft, label: "Чернетка (не публікувати) — поставте галочку, доки не готово", type: boolean }
      - *page_sections

  # ===================== ЮРИДИЧНІ СТОРІНКИ =====================
  # Зараз тут Політика конфіденційності (адреса /privacy-policy).
  - name: legal
    label: Юридичні сторінки
    type: collection
    path: src/content/legal
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: heading
    fields:
      - { name: heading, label: "Заголовок на сторінці", type: string, required: true }
      - { name: title, label: "SEO — заголовок (вкладка браузера, Google)", type: string, required: true }
      - { name: description, label: "SEO — опис для Google", type: text, required: true }
      - { name: body, label: "Текст (## = заголовок розділу, - = пункт списку)", type: rich-text }

  # ===================== ЛОГОТИПИ ТЕХНОЛОГІЙ =====================
  - name: tech
    label: Логотипи технологій
    type: file
    path: src/content/tech.json
    fields:
      - name: items
        label: "Технології"
        type: object
        list: true
        fields:
          - { name: name, label: "Назва", type: string }
          - { name: logo, label: "Логотип", type: image }

  # ===================== БЛОГ =====================
  # Один допис = один файл. Адреса: /blog/<назва-файлу>.
  - name: blog
    label: Блог
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - { name: title, label: "Заголовок", type: string, required: true }
      - { name: description, label: "Короткий опис (для списку і Google)", type: text }
      - { name: date, label: "Дата і час (за ними сортується блог, нові зверху)", type: date, required: true, options: { time: true } }
      - name: category
        label: "Категорія"
        type: select
        options:
          values: ["AI for Startups", "Custom AI Solutions", "Tech Partner Insights"]
      - { name: cover, label: "Обкладинка", type: image }
      - { name: seo_title, label: "SEO — заголовок (необов'язково)", type: string }
      - { name: seo_description, label: "SEO — опис (необов'язково)", type: text }
      - { name: draft, label: "Чернетка (не публікувати) — поставте галочку, доки не готово", type: boolean }
      - { name: body, label: "Текст статті", type: rich-text }
