# Конфігурація панелі редагування Pages CMS (app.pagescms.org).
# Тут описано, які поля ви бачите в панелі. Сам текст лежить у src/content/*.json і src/content/blog/*.md.
# Дизайн, секції та сторінки змінює Claude у коді (див. CLAUDE.md), а не тут.

media:
  input: public/media   # сюди завантажуються картинки в панелі
  output: /media        # так на них посилається сайт

content:
  # ===================== ЗАГАЛЬНЕ ДЛЯ ВСІХ СТОРІНОК =====================
  - name: site
    label: Загальне (шапка, футер, контакти)
    type: file
    path: src/content/site.json
    fields:
      # --- БРЕНД ---
      - { name: brand_name, label: "Назва бренду", type: string }
      - { name: logo, label: "Логотип (шапка і футер)", type: image }
      - { name: contact_email, label: "E-mail", type: string }
      - { name: contact_phone, label: "Телефон", type: string }
      - { name: contact_whatsapp, label: "WhatsApp (номер, як показувати)", type: string }
      - { name: contact_whatsapp_link, label: "WhatsApp — посилання", type: string }
      - { name: formspree_id, label: "ID форми Formspree (для листів)", type: string }

      # --- МЕНЮ ---
      - { name: nav_services_label, label: "Меню — пункт з випадаючим списком послуг", type: string }
      - { name: nav_core_title, label: "Випадаюче меню — заголовок колонки 1", type: string }
      - name: nav_core_services
        label: "Випадаюче меню — послуги колонки 1 (перші 7 — ліворуч, решта — праворуч)"
        type: object
        list: true
        fields:
          - { name: label, label: "Назва", type: string }
          - { name: href, label: "Посилання (напр. /services/ai-integration-services; # = без сторінки)", type: string }
          - { name: icon, label: "Іконка", type: image }
          - name: sub
            label: "Підпункти (з'являються під назвою)"
            type: object
            list: true
            fields:
              - { name: label, label: "Назва", type: string }
              - { name: href, label: "Посилання", type: string }
      - { name: nav_additional_title, label: "Випадаюче меню — заголовок колонки 2", type: string }
      - name: nav_additional_services
        label: "Випадаюче меню — послуги колонки 2"
        type: object
        list: true
        fields:
          - { name: label, label: "Назва", type: string }
          - { name: href, label: "Посилання", type: string }
          - { name: icon, label: "Іконка", type: image }
      - name: nav
        label: "Меню в шапці (після «Services»)"
        type: object
        list: true
        fields:
          - { name: label, label: "Текст", type: string }
          - { name: href, label: "Посилання (напр. /blog)", type: string }
      - name: nav_button
        label: "Кнопка в шапці"
        type: object
        fields:
          - { name: label, label: "Текст", type: string }
          - { name: href, label: "Посилання", type: string }

      # --- ФУТЕР ---
      - name: footer_service_links
        label: "Футер — список послуг (посилання на сторінки послуг)"
        type: object
        list: true
        fields:
          - { name: label, label: "Назва", type: string }
          - { name: href, label: "Посилання (напр. /services/ai-integration-services)", type: string }
      - name: locations
        label: "Адреси офісів (новий рядок у полі = новий рядок на сайті)"
        type: object
        list: true
        fields:
          - { name: name, label: "Назва", type: text }
          - { name: address, label: "Адреса", type: text }
          - { name: flag, label: "Прапорець", type: image }
      - name: socials
        label: "Соцмережі (іконка за назвою: Upwork, LinkedIn, WhatsApp, Clutch)"
        type: object
        list: true
        fields:
          - { name: label, label: "Назва", type: string }
          - { name: href, label: "Посилання", type: string }
      - { name: copyright, label: "Копірайт", type: string }
      - name: legal_links
        label: "Футер — юридичні посилання"
        type: object
        list: true
        fields:
          - { name: label, label: "Текст", type: string }
          - { name: href, label: "Посилання", type: string }

      # --- CLUTCH (відгуки на сторінках послуг) ---
      - { name: clutch_company_id, label: "Clutch — ID компанії", type: string }
      - { name: clutch_reviews, label: "Clutch — ID відгуків через кому (які показувати)", type: string }

      # --- SEO ТА АНАЛІТИКА ---
      - { name: seo_title, label: "SEO — заголовок головної (вкладка браузера, Google)", type: string }
      - { name: seo_description, label: "SEO — опис головної для Google", type: text }
      - { name: og_image, label: "Картинка для соцмереж (за замовчуванням для всіх сторінок)", type: image }
      - { name: gtm_id, label: "Google Tag Manager ID (GTM-XXXX)", type: string }

  # ===================== ГОЛОВНА СТОРІНКА =====================
  - name: home
    label: Головна сторінка
    type: file
    path: src/content/home.json
    fields:
      # --- ГЕРОЙ (головний банер) ---
      - { name: hero_title_accent, label: "Заголовок — виділене слово (мʼятним), на початку", type: string }
      - { name: hero_title_end, label: "Заголовок — решта", type: string }
      - { name: hero_text, label: "Текст під заголовком", type: text }
      - { name: hero_button_primary, label: "Кнопка (текст)", type: string }
      - { name: hero_button_link, label: "Кнопка (посилання)", type: string }

      # --- ПОСЛУГИ ---
      - { name: services_eyebrow, label: "Послуги — мітка зверху", type: string }
      - { name: services_title, label: "Послуги — заголовок", type: string }
      - { name: services_lead, label: "Послуги — опис", type: text }
      - { name: services_core_title, label: "Колонка 1 — заголовок", type: string }
      - name: services_core
        label: "Колонка 1 — послуги"
        type: object
        list: true
        fields:
          - { name: label, label: "Назва", type: string }
          - { name: href, label: "Посилання (# = без сторінки)", type: string }
          - name: sub
            label: "Підпункти (розкриваються при наведенні)"
            type: object
            list: true
            fields:
              - { name: label, label: "Назва", type: string }
              - { name: href, label: "Посилання", type: string }
      - { name: services_additional_title, label: "Колонка 2 — заголовок", type: string }
      - name: services_additional
        label: "Колонка 2 — послуги"
        type: object
        list: true
        fields:
          - { name: label, label: "Назва", type: string }
          - { name: href, label: "Посилання (# = без сторінки)", type: string }

      # --- ЕКСПЕРТИЗА ---
      - { name: expertise_eyebrow, label: "Експертиза — мітка зверху", type: string }
      - { name: expertise_title, label: "Експертиза — заголовок", type: string }
      - { name: expertise_lead, label: "Експертиза — опис", type: text }
      - { name: expertise_image, label: "Експертиза — фото", type: image }
      - { name: expertise_primary_title, label: "Список 1 — заголовок", type: string }
      - { name: expertise_primary, label: "Список 1", type: string, list: true }
      - { name: expertise_secondary_title, label: "Список 2 — заголовок", type: string }
      - { name: expertise_secondary, label: "Список 2", type: string, list: true }

      # --- ПОРТФОЛІО (картки — шість найновіших кейсів, автоматично) ---
      - { name: portfolio_title, label: "Портфоліо — заголовок", type: string }
      - { name: portfolio_lead, label: "Портфоліо — опис", type: text }
      - { name: portfolio_eyebrow, label: "Портфоліо — мітка праворуч", type: string }

      # --- CTA-БЛОК (темний з фото) ---
      - { name: cta_title, label: "CTA — заголовок повністю", type: string }
      - { name: cta_accent, label: "CTA — частина заголовка рожевим (має точно збігатися з текстом)", type: string }
      - { name: cta_button_text, label: "CTA — кнопка (текст)", type: string }
      - { name: cta_button_link, label: "CTA — кнопка (посилання)", type: string }
      - { name: cta_image, label: "CTA — фото", type: image }

      # --- ГАЛУЗІ ---
      - { name: industries_title, label: "Галузі — заголовок", type: string }
      - { name: industries_eyebrow, label: "Галузі — мітка праворуч", type: string }
      - name: industries
        label: "Галузі (плитки)"
        type: object
        list: true
        fields:
          - { name: name, label: "Назва", type: string }
          - { name: icon, label: "Іконка", type: image }
      - { name: industries_image, label: "Галузі — фото праворуч", type: image }

      # --- ЧОМУ МИ ---
      - { name: why_title, label: "Чому ми — заголовок", type: string }
      - { name: why_eyebrow, label: "Чому ми — мітка праворуч", type: string }
      - name: why
        label: "Переваги (картки)"
        type: object
        list: true
        fields:
          - { name: icon, label: "Іконка", type: image }
          - { name: title, label: "Назва", type: string }
          - { name: text, label: "Опис", type: text }

      # --- ПРОЦЕС ---
      - { name: process_title, label: "Процес — заголовок", type: string }
      - { name: process_eyebrow, label: "Процес — мітка", type: string }
      - { name: process_lead, label: "Процес — опис", type: text }
      - name: process
        label: "Кроки процесу (нумеруються самі; картинки також використовуються на сторінках послуг)"
        type: object
        list: true
        fields:
          - { name: title, label: "Назва кроку", type: string }
          - { name: text, label: "Опис", type: text }
          - { name: button_text, label: "Кнопка (текст)", type: string }
          - { name: button_link, label: "Кнопка (посилання)", type: string }
          - { name: image, label: "Ілюстрація", type: image }
          - { name: image_width, label: "Ширина ілюстрації (px)", type: string }
          - { name: avatar, label: "Плашка з аватаром", type: image }
          - { name: avatar_width, label: "Ширина плашки (px)", type: string }
          - { name: icon, label: "Іконка в куті", type: image }

      # --- ТЕХ-СТЕК ---
      - { name: stack_title, label: "Тех-стек — заголовок", type: string }
      - name: stack
        label: "Технології (логотипи)"
        type: object
        list: true
        fields:
          - { name: name, label: "Назва (для доступності)", type: string }
          - { name: image, label: "Логотип", type: image }

      # --- ПИТАННЯ ТА ВІДПОВІДІ ---
      - { name: faq_eyebrow, label: "FAQ — мітка зверху", type: string }
      - { name: faq_title, label: "FAQ — заголовок", type: string }
      - name: faq
        label: "Питання та відповіді (нумеруються самі; у відповіді рядки з «- » або «1. » стають списком)"
        type: object
        list: true
        fields:
          - { name: q, label: "Питання", type: string }
          - { name: a, label: "Відповідь", type: text }

      # --- ФОРМА ---
      - { name: contact_title, label: "Форма — заголовок", type: string }
      - { name: contact_text, label: "Форма — текст під заголовком", type: text }
      - { name: contact_image, label: "Форма — фото", type: image }

  # ===================== ЗАГОЛОВКИ СТОРІНОК =====================
  - name: pages
    label: Сторінки «Кейси», «Блог», «Контакти» (заголовки)
    type: file
    path: src/content/pages.json
    fields:
      - name: portfolio
        label: "Сторінка /portfolio"
        type: object
        fields:
          - { name: seo_title, label: "SEO — заголовок (вкладка браузера, Google)", type: string }
          - { name: seo_description, label: "SEO — опис для Google", type: text }
          - { name: title, label: "Заголовок повністю", type: string }
          - { name: title_accent, label: "Частина заголовка рожевим (має точно збігатися з текстом)", type: string }
          - { name: lead, label: "Опис під заголовком", type: text }
          - { name: button_text, label: "Кнопка (текст)", type: string }
          - { name: button_link, label: "Кнопка (посилання)", type: string }
          - { name: image, label: "Фото праворуч", type: image }
          - { name: tags, label: "Теми (плашки над кейсами)", type: string, list: true }
      - name: blog
        label: "Сторінка /blog (і сторінки категорій)"
        type: object
        fields:
          - { name: seo_title, label: "SEO — заголовок (вкладка браузера, Google)", type: string }
          - { name: seo_description, label: "SEO — опис для Google", type: text }
          - { name: title, label: "Заголовок повністю", type: string }
          - { name: title_accent, label: "Частина заголовка фіолетовим (має точно збігатися з текстом)", type: string }
          - { name: lead, label: "Опис під заголовком", type: text }
      - name: contact
        label: "Сторінка /contact"
        type: object
        fields:
          - { name: seo_title, label: "SEO — заголовок (вкладка браузера, Google)", type: string }
          - { name: seo_description, label: "SEO — опис для Google", type: text }
          - { name: title, label: "Заголовок", type: string }
          - { name: text, label: "Текст під заголовком", type: text }
          - { name: image, label: "Фото біля форми", type: image }

  - name: case_categories
    label: Кольори галузей у кейсах
    type: file
    path: src/content/case-categories.json
    fields:
      - name: items
        label: "Галузь і колір плашки (на сторінці кейсу і на картках кейсів; галузі без кольору — стандартні)"
        type: object
        list: true
        fields:
          - { name: name, label: "Галузь (точно як у кейсі)", type: string }
          - { name: color, label: "Колір (hex, напр. #9cdcfe)", type: string }

  # ===================== КЕЙСИ (ПОРТФОЛІО) =====================
  # Один кейс = один файл. Нова адреса сторінки: /portfolio/<назва-файлу>.
  # Нові кейси краще зберігати як чернетку, доки вони не готові.
  - name: portfolio
    label: Кейси (портфоліо)
    type: collection
    path: src/content/portfolio
    format: json
    filename: "{primary}.json"
    view:
      primary: title
      sort: created
      order: desc
    fields:
      - { name: title, label: "Назва кейсу", type: string, required: true }
      - { name: description, label: "Короткий опис (картка, Google)", type: text }
      - { name: draft, label: "Чернетка (не публікувати) — поставте галочку, доки не готово", type: boolean }
      - { name: created, label: "Дата створення (за нею сортується список, нові зверху)", type: date, options: { time: true } }
      - { name: tag, label: "Бейдж на картці (напр. Under NDA)", type: string }
      - { name: nda, label: "Показувати бейдж на картці (на живому сайті вимкнено для всіх)", type: boolean }
      - { name: categories, label: "Галузі (перша — головна)", type: string, list: true }
      - { name: location, label: "Країна/регіон клієнта", type: string }
      - { name: duration, label: "Тривалість", type: string }
      - { name: services, label: "Послуги", type: string, list: true }
      - { name: tech, label: "Технології (назви як у «Логотипи технологій»)", type: string, list: true }
      - name: highlights
        label: "Ключові цифри (3 шт. вгорі сторінки)"
        type: object
        list: true
        fields:
          - { name: value, label: "Цифра (напр. 12h+)", type: string }
          - { name: label, label: "Підпис", type: string }
      - { name: client_image, label: "Картинка (картка та блок «Клієнт»)", type: image }
      - { name: client_text, label: "Клієнт — текст (порожній рядок = новий абзац, **жирний**)", type: text }
      - { name: product_text, label: "Продукт/послуга — текст", type: text }
      - { name: product_list_title, label: "Продукт — заголовок списку", type: string }
      - { name: product_list, label: "Продукт — список", type: string, list: true }
      - { name: product_text_2, label: "Продукт — текст після списку", type: text }
      - { name: goals, label: "Цілі (кожен елемент — абзац)", type: text, list: true }
      - { name: challenges, label: "Виклики проєкту (список)", type: text, list: true }
      - { name: challenges_style, label: "Вигляд труднощів: list = маркований список, paragraphs = окремі абзаци (як на старому сайті)", type: select, options: { values: ["list", "paragraphs"] } }
      - { name: solution, label: "Рішення — текст", type: text }
      - { name: results_text, label: "Результати — вступний текст", type: text }
      - name: results
        label: "Результати — цифри"
        type: object
        list: true
        fields:
          - { name: value, label: "Цифра (напр. 87%)", type: string }
          - { name: label, label: "Підпис", type: string }
      - { name: results_closing, label: "Результати — заключний текст", type: text }

  # ===================== СТОРІНКИ ПОСЛУГ =====================
  # Одна сторінка = один файл. Адреса: /services/<назва-файлу>.
  # Сторінка складається зі «Секцій»: додавайте, перетягуйте та видаляйте їх у списку.
  # Типи секцій: Головний екран, Вступ із картинкою, Картки, Етапи процесу, Галузі,
  # Технології, Кейси, Заклик до дії, Питання та відповіді, Форма контакту.
  - name: services
    label: Сторінки послуг
    type: collection
    path: src/content/services
    format: json
    filename: "{primary}.json"
    view:
      primary: title
    fields:
      - { name: title, label: "SEO — заголовок сторінки (вкладка браузера, Google)", type: string, required: true }
      - { name: description, label: "SEO — опис для Google", type: text, required: true }
      - { name: draft, label: "Чернетка (не публікувати)", type: boolean }
      # &page_sections: цей самий список секцій використовують і «Нові сторінки» нижче (*page_sections).
      - &page_sections
        name: sections
        label: "Секції сторінки (зверху вниз)"
        type: block
        list: true
        blockKey: type
        blocks:
          - name: hero
            label: "Головний екран (заголовок + кнопка)"
            fields:
              - { name: breadcrumb, label: "Хлібні крихти — назва поточної сторінки", type: string }
              - { name: title, label: "Заголовок H1 (повний текст)", type: string }
              - { name: title_accent, label: "Частина заголовка, що підсвічується (точно як у заголовку)", type: string }
              - { name: accent_color, label: "Колір підсвітки", type: select, options: { values: ["mint", "pink"] } }
              - { name: text, label: "Підзаголовок (новий рядок у полі = новий рядок на сайті)", type: text }
              - { name: button_text, label: "Кнопка — текст", type: string }
              - { name: button_link, label: "Кнопка — посилання (напр. /contact)", type: string }
              - { name: braces, label: "Дужки навколо заголовка: service = квадратні, curly = фігурні", type: select, options: { values: ["service", "curly"] } }
              - { name: background, label: "Фон: service = три фігури, home = як на головній", type: select, options: { values: ["service", "home"] } }
              - { name: heading_class, label: "Технічне (з живого сайту, не змінюйте): клас заголовка", type: string }
              - { name: title_class, label: "Технічне (з живого сайту, не змінюйте): клас тексту заголовка", type: string }
          - name: intro
            label: "Вступ: текст + картинка"
            fields:
              - { name: style, label: "Вигляд: image = світлий з фото, dark = темна картка", type: select, options: { values: ["image", "dark"] } }
              - { name: tag, label: "Мітка зверху", type: string }
              - { name: title, label: "Заголовок", type: string }
              - { name: text, label: "Текст (порожній рядок = новий абзац, **жирний**)", type: text }
              - { name: list, label: "Плашки під текстом (необов'язково, лише світлий вигляд)", type: string, list: true }
